version: '3.8'

services:
  postgres-primary:
    image: postgres:alpine
    container_name: trotamundos_db_primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trotamundos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: